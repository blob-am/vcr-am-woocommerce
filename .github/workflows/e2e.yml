name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (PHP ${{ matrix.php }} · WP ${{ matrix.wp }} · WC ${{ matrix.wc }} · ${{ matrix.storage }})
    runs-on: ubuntu-latest
    # Hard cap so a stuck wp-env/Docker startup fails within minutes
    # instead of burning the 6h GitHub default before anyone notices.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Start narrow. Once stable, broaden the matrix per
        # `WP/WC version policy` in the README.
        php: ['8.3']
        wp: ['latest']
        wc: ['latest']
        # Both order datastores are live in the wild: HPOS is the default
        # for stores created since WC 8.2, legacy post storage is what
        # every older store runs until it migrates. The plugin reads and
        # writes order meta on both, so both get exercised.
        storage: ['hpos', 'posts']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install Composer deps (also runs Strauss → vendor-prefixed/)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Override .wp-env.json with the matrix WordPress version
        # Only patch for a non-default version — the checked-in
        # .wp-env.json already targets latest. The WooCommerce version is
        # NOT set here: it is installed by tests/E2E/scripts/setup-env.mjs
        # via `wp plugin install`, which is the only way to get the
        # canonical `woocommerce` plugin directory that `Requires Plugins`
        # resolves against.
        if: matrix.wp != 'latest'
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('.wp-env.json', 'utf8'));
            c.core = 'WordPress/WordPress#' + '${{ matrix.wp }}';
            fs.writeFileSync('.wp-env.override.json', JSON.stringify(c, null, 2));
          "

      - name: Start wp-env
        # `preenv:start` builds the distributable ZIP and unpacks it into
        # build/e2e/ — the suite drives the artefact that gets published,
        # not the working tree. v0.1.0 shipped unable to make a single HTTP
        # call while a green E2E run tested a tree that could.
        timeout-minutes: 10
        run: npm run env:start

      - name: Wait for wp-env to settle
        # wp-env start is synchronous, but the site isn't always HTTP-
        # reachable the instant it returns — poll the REST root until it
        # answers. Per-step timeout is a backstop in case a hung Docker
        # network stalls the loop despite the curl bounds below.
        timeout-minutes: 3
        run: |
          for i in {1..30}; do
            # Probe the REST index via ?rest_route=, NOT /wp-json/wc/v3.
            # The ?rest_route= form is permalink-agnostic, which is the whole
            # point: wp-env 10.x shipped WordPress with PLAIN permalinks, so
            # the pretty /wp-json/ rewrite did not exist and every /wp-json/*
            # request 404'd forever — that is exactly what stalled this job on
            # every run before it was fixed (WordPress was up; the probe URL
            # was wrong). wp-env 11 turns pretty permalinks on by default, so
            # /wp-json/ happens to work there too — which is precisely why the
            # probe should not depend on it. /wc/v3 would also need auth
            # (401), so the core REST root is the right readiness signal.
            # --connect-timeout/--max-time are load-bearing: without them a
            # socket that accepts but never answers (PHP-FPM not ready yet)
            # blocks curl forever, defeating the loop's own bound.
            if curl -sf --connect-timeout 5 --max-time 10 "http://localhost:8888/?rest_route=/" -o /dev/null; then
              echo "WordPress REST responding"
              exit 0
            fi
            sleep 2
          done
          echo "WordPress REST never responded"
          # --watch=false: wp-env logs follows (tails) by default, which
          # would hang this step until its timeout instead of dumping and
          # exiting. We want the snapshot, then a clean non-zero exit.
          npx wp-env logs all --watch=false || true
          exit 1

      - name: Run Playwright tests
        # `pretest:e2e` installs and activates WooCommerce and switches the
        # order datastore before Playwright starts.
        env:
          WC_VERSION: ${{ matrix.wc }}
          WC_ORDER_STORAGE: ${{ matrix.storage }}
        run: npm run test:e2e

      - name: Capture wp-env logs on failure
        if: failure()
        # --watch=false so this dumps a snapshot and exits; per-step
        # timeout is a backstop in case a wp-env version ignores the flag.
        timeout-minutes: 2
        run: npx wp-env logs all --watch=false || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-php${{ matrix.php }}-wp${{ matrix.wp }}-wc${{ matrix.wc }}-${{ matrix.storage }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npm run env:stop || true
