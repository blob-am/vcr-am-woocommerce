name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (PHP ${{ matrix.php }} · WP ${{ matrix.wp }} · WC ${{ matrix.wc }})
    runs-on: ubuntu-latest
    # Hard cap so a stuck wp-env/Docker startup fails within minutes
    # instead of burning the 6h GitHub default before anyone notices.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Start narrow. Once stable, broaden the matrix per
        # `WP/WC version policy` in the README.
        php: ['8.3']
        wp: ['latest']
        wc: ['latest']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install Composer deps (also runs Strauss → vendor-prefixed/)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Override .wp-env.json with matrix versions
        # Only patch when the matrix selects a non-default version, to
        # avoid touching the file in the latest×latest case (the
        # checked-in .wp-env.json already targets latest).
        if: matrix.wp != 'latest' || matrix.wc != 'latest'
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('.wp-env.json', 'utf8'));
            const wp = '${{ matrix.wp }}';
            const wc = '${{ matrix.wc }}';
            if (wp !== 'latest') {
              c.core = 'WordPress/WordPress#' + wp;
            }
            if (wc !== 'latest') {
              c.plugins = c.plugins.map((p) =>
                p.includes('woocommerce') ? 'https://downloads.wordpress.org/plugin/woocommerce.' + wc + '.zip' : p
              );
            }
            fs.writeFileSync('.wp-env.override.json', JSON.stringify(c, null, 2));
          "

      - name: Start wp-env
        timeout-minutes: 10
        run: npm run env:start

      - name: Wait for wp-env to settle
        # wp-env start is synchronous, but the site isn't always HTTP-
        # reachable the instant it returns — poll the REST root until it
        # answers. Per-step timeout is a backstop in case a hung Docker
        # network stalls the loop despite the curl bounds below.
        timeout-minutes: 3
        run: |
          for i in {1..30}; do
            # Probe the REST index via ?rest_route=, NOT /wp-json/wc/v3:
            # wp-env ships WordPress with PLAIN permalinks, so the pretty
            # /wp-json/ rewrite never exists and every /wp-json/* request
            # 404s forever — that is exactly what stalled this job on every
            # run before (WordPress was up; the probe URL was wrong). The
            # ?rest_route= form is permalink-agnostic and returns the public
            # REST index (200). /wc/v3 would also need auth (401), so the
            # core REST root is the right readiness signal.
            # --connect-timeout/--max-time are load-bearing: without them a
            # socket that accepts but never answers (PHP-FPM not ready yet)
            # blocks curl forever, defeating the loop's own bound.
            if curl -sf --connect-timeout 5 --max-time 10 "http://localhost:8888/?rest_route=/" -o /dev/null; then
              echo "WordPress REST responding"
              exit 0
            fi
            sleep 2
          done
          echo "WordPress REST never responded"
          # --watch=false: wp-env logs follows (tails) by default, which
          # would hang this step until its timeout instead of dumping and
          # exiting. We want the snapshot, then a clean non-zero exit.
          npx wp-env logs all --watch=false || true
          exit 1

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Capture wp-env logs on failure
        if: failure()
        # --watch=false so this dumps a snapshot and exits; per-step
        # timeout is a backstop in case a wp-env version ignores the flag.
        timeout-minutes: 2
        run: npx wp-env logs all --watch=false || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-php${{ matrix.php }}-wp${{ matrix.wp }}-wc${{ matrix.wc }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npm run env:stop || true
